<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Srujan Fund Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="logo"><img src="assets/img/logo.svg" alt="" class="logo-seal" width="46" height="46"><span class="logo-text">Srujan Fund Support<small>Applicant Portal</small></span></a>
      <a href="index.html" class="btn btn-ghost btn-sm">← Back to site</a>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:18px">
        <img src="assets/img/logo.svg" alt="Srujan Fund Support seal" width="88" height="88" style="display:inline-block">
        <div class="logo-text" style="font-size:1.05rem;margin-top:6px">Srujan Fund Support</div>
      </div>
      <div id="msg"></div>

      <form id="loginForm" novalidate>
        <h2 id="formTitle" style="font-size:1.3rem">Applicant Login</h2>
        <p class="muted small" id="formHint">Log in with the email and password the programme team gave you, to view your application.</p>
        <div class="field"><label for="li-email">Email</label><input id="li-email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="li-pw">Password</label><input id="li-pw" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary" style="width:100%" type="submit">Log in</button>
        <p class="small muted" style="margin:14px 0 0;text-align:center">Forgot your password? Please contact the programme team and we'll reset it for you.</p>
      </form>

      <p class="small muted" style="margin:18px 0 0;text-align:center" id="switchRow"><button type="button" class="link-btn" id="switchBtn">Staff login</button></p>
    </div>
  </main>

  <script type="module">
    import "./assets/js/common.js";
    import { store, friendlyError } from "./assets/js/store.js";

    const $ = id => document.getElementById(id);
    const msg = (text, type = "error") => { $("msg").innerHTML = text ? `<div class="alert alert-${type}">${text}</div>` : ""; };
    const params = new URLSearchParams(location.search);
    let next = params.get("next") === "admin" ? "admin.html" : "dashboard.html";

    function setMode(staff) {
      next = staff ? "admin.html" : "dashboard.html";
      $("formTitle").textContent = staff ? "Staff login" : "Applicant Login";
      $("formHint").textContent = staff ? "Sign in to the admin console." : "Log in with the email and password the programme team gave you, to view your application.";
      $("switchBtn").textContent = staff ? "Applicant login" : "Staff login";
      msg("");
    }
    setMode(next === "admin.html");
    $("switchBtn").addEventListener("click", () => setMode($("formTitle").textContent !== "Staff login"));

    let busy = false;
    store.onUser(u => { if (u && !busy) location.replace(next); });

    $("loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      const email = $("li-email").value, password = $("li-pw").value;
      if (!email || !password) return msg("Please enter your email and password.");
      const btn = e.target.querySelector("button[type=submit]"); busy = true; btn.disabled = true; msg("");
      try { await store.signIn({ email, password }); location.replace(next); }
      catch (err) { busy = false; btn.disabled = false; msg(friendlyError(err)); }
    });
  </script>
</body>
</html>
